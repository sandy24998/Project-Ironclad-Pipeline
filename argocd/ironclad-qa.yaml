apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ironclad-qa
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sandy24998/Project-Ironclad-Pipeline.git
    targetRevision: gitops-dev
    path: k8s/overlays/qa

  destination:
    server: https://kubernetes.default.svc
    namespace: qa

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
